{% extends 'base.html' %}

{% block content %}
<!-- Página de Login Administrativo da Barbearia -->
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header bg-dark text-white text-center">
                <h4 class="mb-0">Acesso Administrativo</h4>
            </div>
            <div class="card-body">
                <!-- Formulário de Login (Usuário e Senha) -->
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <input type="text" name="username" class="form-control" required autofocus placeholder="Digite seu usuário">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control" required placeholder="Digite sua senha">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Entrar no Painel</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-muted text-center">
                <small>Acesso restrito a barbeiros e administradores da {{ config.nome_barbearia }}.</small>
            </div>
        </div>
        
        <!-- Link de retorno para a página inicial do cliente -->
        <div class="text-center mt-3">
            <a href="{{ url_for('home_cliente', slug=config.slug) }}" class="text-decoration-none text-muted">
                <small>&larr; Voltar para a página da barbearia</small>
            </a>
        </div>
    </div>
</div>
{% endblock %}
